name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # Integração Contínua (CI)
  # Executa em push e pull_request para a branch main
  # ==========================================
  ci:
    name: CI - Testes e Validações
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar dependências
        run: |
          npm install

      - name: 4. Executar testes automatizados
        run: |
          npm test

  # ==========================================
  # Entrega / Deployment Contínuo (CD)
  # Executa SOMENTE após push na main e SE a CI tiver sucesso
  # ==========================================
  cd:
    name: CD - Deploy no GitHub Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 3. Empacotar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 4. Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
